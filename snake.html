<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇小游戏</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    user-select: none;
  }

  .game-container {
    background: #16213e;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    text-align: center;
  }

  h1 {
    color: #e94560;
    margin-bottom: 12px;
    letter-spacing: 4px;
  }

  .score-board {
    display: flex;
    justify-content: space-between;
    color: #fff;
    margin-bottom: 12px;
    font-size: 18px;
  }

  .score-board span {
    color: #f5a623;
    font-weight: bold;
  }

  canvas {
    background: #0f3460;
    border-radius: 8px;
    display: block;
    box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.4);
  }

  .controls {
    margin-top: 16px;
    color: #aaa;
    font-size: 14px;
    line-height: 1.8;
  }

  .controls kbd {
    background: #0f3460;
    padding: 2px 8px;
    border-radius: 4px;
    color: #fff;
    font-family: monospace;
  }

  #restart-btn {
    margin-top: 16px;
    padding: 10px 28px;
    font-size: 16px;
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }

  #restart-btn:hover {
    background: #ff6b81;
  }

  .game-over {
    color: #e94560;
    font-size: 20px;
    font-weight: bold;
    margin-top: 8px;
    min-height: 28px;
  }
</style>
</head>
<body>
  <div class="game-container">
    <h1>🐍 贪吃蛇</h1>
    <div class="score-board">
      <div>得分：<span id="score">0</span></div>
      <div>最高分：<span id="high-score">0</span></div>
    </div>
    <canvas id="game-canvas" width="400" height="400"></canvas>
    <div class="game-over" id="game-over"></div>
    <div class="controls">
      操作：<kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 控制方向<br>
      空格键暂停 / 继续
    </div>
    <button id="restart-btn">重新开始</button>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('high-score');
  const gameOverEl = document.getElementById('game-over');
  const restartBtn = document.getElementById('restart-btn');

  // 游戏配置
  const GRID_SIZE = 20;      // 网格数量（20x20）
  const CELL_SIZE = canvas.width / GRID_SIZE; // 每格像素

  let snake, direction, nextDirection, food, score, highScore;
  let gameLoop, isRunning, isPaused;

  // 读取本地存储的最高分
  highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
  highScoreEl.textContent = highScore;

  function init() {
    // 蛇初始在中间，长度 3
    const mid = Math.floor(GRID_SIZE / 2);
    snake = [
      { x: mid, y: mid },
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid }
    ];
    direction = { x: 1, y: 0 }; // 初始向右
    nextDirection = direction;
    score = 0;
    scoreEl.textContent = score;
    gameOverEl.textContent = '';
    isRunning = true;
    isPaused = false;
    spawnFood();
    draw();
  }

  // 随机生成食物（避开蛇身）
  function spawnFood() {
    do {
      food = {
        x: Math.floor(Math.random() * GRID_SIZE),
        y: Math.floor(Math.random() * GRID_SIZE)
      };
    } while (snake.some(seg => seg.x === food.x && seg.y === food.y));
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 绘制网格线（可选，淡色）
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID_SIZE; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL_SIZE, 0);
      ctx.lineTo(i * CELL_SIZE, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL_SIZE);
      ctx.lineTo(canvas.width, i * CELL_SIZE);
      ctx.stroke();
    }

    // 绘制食物
    ctx.fillStyle = '#e94560';
    ctx.beginPath();
    ctx.arc(
      food.x * CELL_SIZE + CELL_SIZE / 2,
      food.y * CELL_SIZE + CELL_SIZE / 2,
      CELL_SIZE / 2 - 2,
      0,
      Math.PI * 2
    );
    ctx.fill();

    // 绘制蛇
    snake.forEach((seg, i) => {
      const isHead = i === 0;
      ctx.fillStyle = isHead ? '#4ecca3' : '#2ecc71';
      const pad = 1;
      const radius = 4;
      const x = seg.x * CELL_SIZE + pad;
      const y = seg.y * CELL_SIZE + pad;
      const w = CELL_SIZE - pad * 2;
      const h = CELL_SIZE - pad * 2;
      // 圆角矩形
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, radius);
      ctx.fill();

      // 蛇头画眼睛
      if (isHead) {
        ctx.fillStyle = '#fff';
        const cx = seg.x * CELL_SIZE + CELL_SIZE / 2;
        const cy = seg.y * CELL_SIZE + CELL_SIZE / 2;
        const offset = CELL_SIZE / 5;
        let ex1, ey1, ex2, ey2;
        if (direction.x === 1) {
          ex1 = cx + offset; ey1 = cy - offset;
          ex2 = cx + offset; ey2 = cy + offset;
        } else if (direction.x === -1) {
          ex1 = cx - offset; ey1 = cy - offset;
          ex2 = cx - offset; ey2 = cy + offset;
        } else if (direction.y === 1) {
          ex1 = cx - offset; ey1 = cy + offset;
          ex2 = cx + offset; ey2 = cy + offset;
        } else {
          ex1 = cx - offset; ey1 = cy - offset;
          ex2 = cx + offset; ey2 = cy - offset;
        }
        ctx.beginPath();
        ctx.arc(ex1, ey1, 2.5, 0, Math.PI * 2);
        ctx.arc(ex2, ey2, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(ex1, ey1, 1.2, 0, Math.PI * 2);
        ctx.arc(ex2, ey2, 1.2, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }

  function update() {
    if (!isRunning || isPaused) return;

    direction = nextDirection;
    const head = snake[0];
    const newHead = {
      x: head.x + direction.x,
      y: head.y + direction.y
    };

    // 检测撞墙
    if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
      gameOver();
      return;
    }

    // 检测撞到自己（先假设要吃掉食物会增长，所以尾部判断要小心）
    const willEat = newHead.x === food.x && newHead.y === food.y;
    const bodyToCheck = willEat ? snake : snake.slice(0, -1);
    if (bodyToCheck.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
      gameOver();
      return;
    }

    snake.unshift(newHead);

    if (willEat) {
      score += 10;
      scoreEl.textContent = score;
      spawnFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function gameOver() {
    isRunning = false;
    clearInterval(gameLoop);
    gameOverEl.textContent = '游戏结束！';
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeHighScore', highScore);
      highScoreEl.textContent = highScore;
      gameOverEl.textContent = '🎉 新纪录！游戏结束！';
    }
  }

  function startLoop() {
    clearInterval(gameLoop);
    gameLoop = setInterval(update, 120);
  }

  function restart() {
    init();
    startLoop();
  }

  function togglePause() {
    if (!isRunning) return;
    isPaused = !isPaused;
    gameOverEl.textContent = isPaused ? '已暂停' : '';
  }

  // 键盘控制
  document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    let newDir = null;

    if (key === 'arrowup' || key === 'w') newDir = { x: 0, y: -1 };
    else if (key === 'arrowdown' || key === 's') newDir = { x: 0, y: 1 };
    else if (key === 'arrowleft' || key === 'a') newDir = { x: -1, y: 0 };
    else if (key === 'arrowright' || key === 'd') newDir = { x: 1, y: 0 };
    else if (key === ' ') {
      e.preventDefault();
      togglePause();
      return;
    }

    if (newDir) {
      e.preventDefault();
      // 禁止直接反向
      if (newDir.x === -direction.x && newDir.y === -direction.y) return;
      nextDirection = newDir;
    }
  });

  restartBtn.addEventListener('click', restart);

  // 启动游戏
  init();
  startLoop();
})();
</script>
</body>
</html>
