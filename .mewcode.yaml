# mewcode MCP 服务器配置（项目级）
# 同名 server 会覆盖用户级 ~/.mewcode/config.yaml 里的定义。
# command / args / env / headers 的值都支持 ${VAR} 从宿主环境变量展开（密钥不落盘）。

mcp_servers:
  # mewcode 自带的网页搜索（DuckDuckGo，无需 API key、无需另开进程）。
  # 工具名：mcp__web__search_web
  web:
    type: stdio
    command: "${MEWCODE_PYTHON}"   # cli 启动时注入 = 当前运行 mewcode 的解释器
    args: ["-m", "mewcode.mcp_servers.web_search"]

  # 可选：Tavily 搜索（效果更好，需要 API key + 手动启动 HTTP server）。
  # 启用前先去 https://tavily.com 注册，并删除下面的注释。
  # tavily:
  #   type: http
  #   url: "http://localhost:8083/mcp"
