[project]
name = "mewcode"
version = "0.1.0"
description = "A multi-protocol LLM terminal chat client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
    "rich>=13",
    "anthropic>=0.40",
    "openai>=1.50",
    "pyyaml>=6",
    "mcp>=2.2.0",
    "httpx2>=2.5.0",
]

[project.scripts]
mewcode = "mewcode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mewcode"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
